<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Trace — your work, connected</title>
  <desc id="desc">A privacy-safe illustration of the Trace desktop workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="30" x2="1120" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#10243b"/>
      <stop offset="1" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <circle cx="1045" cy="25" r="290" fill="url(#glow)"/>
  <circle cx="120" cy="650" r="270" fill="#38bdf8" opacity=".07"/>

  <g transform="translate(86 76)">
    <path d="M0 0h45" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 19h35" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 38h27" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
    <circle cx="53" cy="0" r="5" fill="#38bdf8"/>
    <circle cx="43" cy="19" r="5" fill="#a78bfa"/>
  </g>
  <text x="160" y="111" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="44" font-weight="700" letter-spacing="-1.5">Trace</text>
  <text x="86" y="169" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="25" font-weight="500">Your work, connected.</text>
  <text x="86" y="203" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="16">A local-first command center for projects, context, and decisions.</text>

  <g filter="url(#shadow)" transform="translate(420 67)">
    <rect width="692" height="486" rx="20" fill="#f8fafc"/>
    <rect width="692" height="47" rx="20" fill="#ffffff"/>
    <rect y="27" width="692" height="20" fill="#ffffff"/>
    <circle cx="23" cy="23" r="5" fill="#fda4af"/>
    <circle cx="41" cy="23" r="5" fill="#fde047"/>
    <circle cx="59" cy="23" r="5" fill="#86efac"/>
    <text x="346" y="28" text-anchor="middle" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="11" font-weight="600">TRACE</text>

    <rect y="47" width="151" height="439" fill="#f1f5f9"/>
    <g fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="11" font-weight="600">
      <rect x="18" y="69" width="115" height="33" rx="8" fill="#e0f2fe"/>
      <circle cx="34" cy="85" r="5" fill="#0ea5e9"/>
      <text x="49" y="89" fill="#0369a1">Today</text>
      <circle cx="34" cy="124" r="5" fill="#94a3b8"/>
      <text x="49" y="128">Initiatives</text>
      <circle cx="34" cy="163" r="5" fill="#94a3b8"/>
      <text x="49" y="167">Deliverables</text>
      <circle cx="34" cy="202" r="5" fill="#94a3b8"/>
      <text x="49" y="206">Ask Trace</text>
      <circle cx="34" cy="241" r="5" fill="#94a3b8"/>
      <text x="49" y="245">Knowledge</text>
      <circle cx="34" cy="280" r="5" fill="#94a3b8"/>
      <text x="49" y="284">Reports</text>
    </g>

    <text x="181" y="85" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="700">Good morning</text>
    <text x="181" y="108" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="11">Here is the shape of your work today.</text>

    <g transform="translate(181 130)">
      <rect width="149" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="700">ACTIVE WORK</text>
      <text x="15" y="58" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="700">7</text>
      <circle cx="123" cy="43" r="14" fill="#e0f2fe"/>
      <path d="M117 43h12M123 37v12" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(342 130)">
      <rect width="149" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="700">NEEDS ATTENTION</text>
      <text x="15" y="58" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="700">2</text>
      <circle cx="123" cy="43" r="14" fill="#fef3c7"/>
      <path d="M123 35v10M123 50h.01" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(503 130)">
      <rect width="159" height="78" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="15" y="24" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="700">CONNECTED SOURCES</text>
      <text x="15" y="58" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="27" font-weight="700">4</text>
      <circle cx="133" cy="43" r="14" fill="#ede9fe"/>
      <circle cx="128" cy="43" r="3" fill="#7c3aed"/>
      <circle cx="138" cy="38" r="3" fill="#7c3aed"/>
      <path d="m131 42 4-2M131 45l4 4" stroke="#7c3aed" stroke-width="1.8"/>
    </g>

    <rect x="181" y="228" width="481" height="116" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="199" y="254" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="700">Focus</text>
    <rect x="199" y="272" width="7" height="48" rx="3.5" fill="#38bdf8"/>
    <text x="220" y="288" fill="#334155" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">Prepare launch decision brief</text>
    <text x="220" y="309" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="10">3 linked conversations · 2 supporting files · due Friday</text>
    <rect x="567" y="278" width="76" height="24" rx="12" fill="#ecfdf5"/>
    <text x="605" y="294" text-anchor="middle" fill="#047857" font-family="Inter, ui-sans-serif, system-ui" font-size="9" font-weight="700">IN REVIEW</text>

    <rect x="181" y="360" width="481" height="93" rx="14" fill="#0f172a"/>
    <circle cx="207" cy="386" r="11" fill="#0ea5e9"/>
    <path d="m202 386 3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="228" y="390" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="650">Ask across your connected work</text>
    <text x="199" y="423" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="11">What changed, what is blocked, and what deserves attention?</text>
    <rect x="598" y="407" width="42" height="24" rx="8" fill="#0284c7"/>
    <path d="M611 419h14M621 415l4 4-4 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(86 285)" font-family="Inter, ui-sans-serif, system-ui">
    <g>
      <circle cx="18" cy="18" r="18" fill="#0ea5e9" fill-opacity=".16"/>
      <path d="M11 18h14M18 11v14" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
      <text x="49" y="14" fill="#f8fafc" font-size="13" font-weight="700">Capture</text>
      <text x="49" y="33" fill="#94a3b8" font-size="11">Ideas, email, meetings, files</text>
    </g>
    <path d="M18 53v31" stroke="#334155" stroke-width="2" stroke-dasharray="3 5"/>
    <g transform="translate(0 100)">
      <circle cx="18" cy="18" r="18" fill="#8b5cf6" fill-opacity=".16"/>
      <circle cx="13" cy="18" r="3" fill="#a78bfa"/>
      <circle cx="23" cy="13" r="3" fill="#a78bfa"/>
      <path d="m16 17 4-2M16 20l4 4" stroke="#a78bfa" stroke-width="2"/>
      <text x="49" y="14" fill="#f8fafc" font-size="13" font-weight="700">Connect</text>
      <text x="49" y="33" fill="#94a3b8" font-size="11">Context becomes a work graph</text>
    </g>
    <path d="M18 153v31" stroke="#334155" stroke-width="2" stroke-dasharray="3 5"/>
    <g transform="translate(0 200)">
      <circle cx="18" cy="18" r="18" fill="#22c55e" fill-opacity=".15"/>
      <path d="m10 18 5 5 11-13" stroke="#4ade80" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="49" y="14" fill="#f8fafc" font-size="13" font-weight="700">Decide</text>
      <text x="49" y="33" fill="#94a3b8" font-size="11">Ask, prioritize, and ship</text>
    </g>
  </g>
</svg>
