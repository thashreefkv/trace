[package]
name = "eval-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
project-manager-shared = { path = "../../shared" }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
