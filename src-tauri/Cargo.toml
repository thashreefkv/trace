[package]
name = "trace"
version = "0.1.0"
description = "Personal strategic work application"
authors = ["thash"]
edition = "2021"

[workspace]
members = [".", "shared", "bin/mcp-server", "bin/eval-runner"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "project_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ulid = "1"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
project-manager-shared = { path = "shared" }
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
zip = "8"
base64 = "0.22"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
